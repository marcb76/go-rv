name: CI/CD Pipeline - go-rv!

# WARNING: This pipeline requires GitHub Secrets (DOCKERHUB_USERNAME, DOCKERHUB_PASSWORD, 
# AWS_EC2_HOST, AWS_EC2_USER, and AWS_SSH_PRIVATE_KEY) to be properly configured 
# in the repository settings before running, otherwise deployment will fail.

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # Allows manual triggering of the workflow from the GitHub Actions interface

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Obtain the source code from the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Go environment
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'

    # 3. Run automated tests
    - name: Run Tests
      run: go test -v ./...

    # 4. Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    # 5. Build and push Docker image to Docker Hub
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/go-rv:latest

    # 6. Deploy to AWS EC2 via SSH
